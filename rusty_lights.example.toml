# RustyLights Example Configuration
# Copy to /etc/rusty_lights.conf (or ./rusty_lights.toml) and adjust as needed

[audio]
backend = "pipewire"        # pipewire | alsa | fifo
device = "auto"             # "auto" or specific device name
sample_rate = 48000
chunk_size = 512
# fifo_path = "/tmp/mpd.fifo"  # Path to named pipe (used when backend = "fifo")

[dsp]
fft_size = 512              # 256 | 512 | 1024
mel_bands = 24              # 16 - 32 recommended
freq_min = 20               # Hz
freq_max = 18000            # Hz
smoothing = 0.7             # 0.0 - 1.0 (higher = smoother)
beat_sensitivity = 1.5      # 1.0 - 3.0 (higher = fewer beats detected)

[effect]
name = "spectrum"           # energy | spectrum | scroll | reactive

[effect.params]
gradient = "rainbow"        # rainbow | fire | ocean
mirror = false
brightness = 1.0

[output]
protocol = "e131"           # e131 | ddp | artnet
target = "239.255.0.1"      # Multicast address or IP of LED controller
universe = 1
fps = 60
idle_timeout = 0            # Minutes without audio before closing connection (0 = disabled)

[output.leds]
count = 300
rgb_order = "GRB"           # RGB | GRB | BGR (depends on LED strip)

[http]
enabled = false               # Enable browser debug UI (requires --features http)
port = 8080                    # Web UI port

# Optional: Multiple output segments for complex setups
# [[output.segments]]
# target = "192.168.1.100"
# universe = 1
# start_led = 0
# end_led = 150
#
# [[output.segments]]
# target = "192.168.1.101"
# universe = 2
# start_led = 150
# end_led = 300
