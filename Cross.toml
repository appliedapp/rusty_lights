[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main"
pre-build = [
    "dpkg --add-architecture arm64 && apt-get update && apt-get install -y libasound2-dev:arm64"
]

[target.arm-unknown-linux-gnueabihf]
image = "ghcr.io/cross-rs/arm-unknown-linux-gnueabihf:main"
pre-build = [
    "dpkg --add-architecture armhf && apt-get update && apt-get install -y libasound2-dev:armhf"
]

[target.armv7-unknown-linux-gnueabihf]
image = "ghcr.io/cross-rs/armv7-unknown-linux-gnueabihf:main"
pre-build = [
    "dpkg --add-architecture armhf && apt-get update && apt-get install -y libasound2-dev:armhf"
]
